# Render.com deployment manifest.
# Push this repo to GitHub, then in Render Dashboard → New + → Blueprint →
# select your repo. Render reads this file and provisions both services.
#
# Env-var values left as `sync: false` MUST be set manually in the Render
# dashboard for each service after the initial deploy.

services:
  # -----------------------------------------------------------------
  # Node API server — Express + Prisma. Serves /api/* endpoints.
  # -----------------------------------------------------------------
  - type: web
    name: cognito-stream-server
    runtime: node
    plan: starter            # $7/mo, 512MB RAM. Fine for the API.
    region: oregon
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000

      # Hosted Postgres + auth secret — fill in via dashboard.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false

      # Renderer base URL. Dashboard-managed on purpose: the renderer runs on
      # a Hugging Face Docker Space, not on Render, so there is no private
      # network hostname to hardcode here. A literal value would be re-applied
      # on every blueprint sync and silently break rendering — the server's
      # /health does not probe the renderer, so it would still report ok.
      - key: RENDERER_URL
        sync: false

      # Public client URL for CORS allow-list. Vercel/Netlify URL of the SPA.
      - key: CLIENT_URL
        sync: false

      # LLM keys. PRIMARY is the free-tier key; SECONDARY is the paid key
      # that takes over when the free tier hits a quota error.
      - key: GEMINI_API_KEY_PRIMARY
        sync: false
      - key: GEMINI_API_KEY_SECONDARY
        sync: false
      # Planning / general text — the easy task, one call per video.
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      # Manim code generation and repair — the hard task. A weaker model here
      # means more broken scripts, and each repair costs another full render.
      - key: GEMINI_CODE_MODEL
        value: gemini-3.7-flash

      # Parallel scene renders. Matched to the renderer's CPU count — the free
      # HF Space is 2 vCPU. Manim is CPU-bound, so a higher value only
      # timeshares the same cores and adds memory pressure. Raise this only
      # alongside the Space's hardware tier, not on its own.
      - key: SCENE_CONCURRENCY
        value: "2"

  # -----------------------------------------------------------------
  # Manim renderer — NOT deployed here.
  # -----------------------------------------------------------------
  # It runs as a Hugging Face Docker Space, built from renderer/Dockerfile:
  #   https://huggingface.co/spaces/AbhiG0212/cognito-stream-renderer
  #   -> https://abhig0212-cognito-stream-renderer.hf.space
  #
  # The Space is a separate git repo with renderer/'s contents at its root, so
  # pushing this repo to GitHub does NOT update it. To ship renderer changes,
  # sync that clone and push to the Space remote (see DEPLOYMENT.md Step 3).
  #
  # Its env vars (SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
  # SUPABASE_STORAGE_BUCKET, OUTPUT_DIR, TEMP_DIR, AUDIO_DIR, PORT,
  # DEFAULT_RENDER_QUALITY) live in the Space's Settings -> Variables and
  # secrets, not in this file.
  #
  # A `pserv` block used to sit here describing a Render private service with a
  # placeholder image. Nothing was ever deployed from it, and the internal
  # hostname it implied is what made the old hardcoded RENDERER_URL look valid.
