# Keeps the free-tier Supabase project from idling out.
#
# `server/src/index.ts` exposes /health/db, which runs a trivial `SELECT 1`
# through Prisma. The endpoint existed but nothing ever called it, so the
# project still went unreachable (both Postgres and the Storage API, since
# storage keeps its object metadata in Postgres). This workflow is the
# scheduler that was missing.
#
# Caveat: GitHub disables scheduled workflows on repositories with no commit
# activity for 60 days, and may delay runs under load. If this repo goes
# quiet for long stretches, use an external pinger (cron-job.org,
# UptimeRobot) against the same URL instead.
name: keep-alive

on:
  schedule:
    - cron: '*/10 * * * *' # every 10 minutes
  workflow_dispatch: # manual "Run workflow" button

# A hung request should never occupy a runner for long.
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the DB health endpoint
        run: |
          set -uo pipefail
          URL="${SERVER_URL:-https://cognito-stream-server.onrender.com}/health/db"
          # Render's free tier cold-starts, so allow a slow first response and
          # retry a few times before calling it a failure.
          code=$(curl -sS -o /tmp/body.json -w '%{http_code}' \
                   --max-time 120 --retry 3 --retry-delay 20 --retry-all-errors \
                   "$URL" || echo 000)
          echo "status: $code"
          cat /tmp/body.json 2>/dev/null || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::DB health check failed (HTTP $code) — the Supabase project may be paused."
            exit 1
          fi
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
