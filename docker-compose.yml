services:
  renderer:
    build:
      context: ./renderer
      dockerfile: Dockerfile
    container_name: cognito-renderer
    ports:
      - "5000:5000"
    volumes:
      # Persistent storage - all in ./storage folder
      - ./storage/output:/app/output
      - ./storage/temp:/app/temp
      - ./storage/audio:/app/audio
    environment:
      - PORT=5000
      - OUTPUT_DIR=/app/output
      - TEMP_DIR=/app/temp
      - AUDIO_DIR=/app/audio
      - DEBUG=false
      - FLASK_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

  # Optional: Add nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: cognito-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./storage/output:/usr/share/nginx/html/videos:ro
    depends_on:
      - renderer
    restart: unless-stopped