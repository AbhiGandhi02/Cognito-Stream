services:
  renderer:
    build:
      context: ./renderer
      dockerfile: Dockerfile
    container_name: cognito-renderer
    ports:
      - "5000:5000"
    volumes:
      # Persistent storage
      - ./storage/output:/app/output
      - ./storage/temp:/app/temp
      - ./storage/audio:/app/audio
      # Mount source code for hot-reload (no rebuild needed on code changes)
      - ./renderer/app.py:/app/app.py
      - ./renderer/utils:/app/utils
    environment:
      - PORT=5000
      - OUTPUT_DIR=/app/output
      - TEMP_DIR=/app/temp
      - AUDIO_DIR=/app/audio
      - DEBUG=true
      - FLASK_ENV=development
      # Cloud storage (optional — leave empty to render to local disk only).
      # When all three are set, renderer uploads finished mp4/mp3 to Supabase
      # Storage and returns the public URL instead of /videos/... or /audio/...
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET:-cognito-stream}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

  # Optional: Add nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: cognito-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./storage/output:/usr/share/nginx/html/videos:ro
    depends_on:
      - renderer
    restart: unless-stopped
